<div class="details">

  <h1>{{ coffee.title }}</h1>

  <img
    [src]="coffee.image"
    [alt]="coffee.title"
  >

  <h2>Description</h2><span>{{ coffee.description }}</span>

  <h2>Ingrédients</h2>

  <ul>
    @for (ingredient of coffee.ingredients; track ingredient) {
      <li>{{ ingredient }}</li>
    }
  </ul>
<div class="back-link">
  <a routerLink="/coffee">
    Return to Menu
  </a>
</div>
</div>
